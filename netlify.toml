# Netlify – Next.js is detected automatically (OpenNext adapter); no plugin needs to be installed.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_APP_URL: set it in the Netlify UI only when using a custom domain –
  # otherwise next.config.ts falls back to the site URL Netlify provides (process.env.URL)
  # Netlify's build image is Linux, so sharp gets the right native binary for upload processing
  NPM_FLAGS = "--include=optional"

# Retention job (replaces the Vercel cron in vercel.json) – every 10 minutes, UTC
[functions."cleanup-cron"]
  schedule = "*/10 * * * *"
